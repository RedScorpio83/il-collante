<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none" width="100%" height="100%">
  <!-- Hardware Node (Left: Gears & Physical Systems) -->
  <g transform="translate(10, 5)">
    <path d="M28 8 L50 20.7 L50 61.3 L28 74 L6 61.3 L6 20.7 Z" stroke="#13202C" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="28" cy="41" r="9" stroke="#13202C" stroke-width="4.5" fill="none"/>
    <circle cx="28" cy="41" r="4" fill="#13202C"/>

    <!-- Software / AI Node (Right: Neural Network & Circuit Bus) -->
    <path d="M92 8 L114 20.7 L114 61.3 L92 74 L70 61.3 L70 20.7 Z" stroke="#1D5F8E" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="92" cy="41" r="5" fill="#1D5F8E"/>
    <circle cx="81" cy="30" r="3.5" fill="#1D5F8E"/>
    <circle cx="103" cy="30" r="3.5" fill="#1D5F8E"/>
    <circle cx="81" cy="52" r="3.5" fill="#1D5F8E"/>
    <circle cx="103" cy="52" r="3.5" fill="#1D5F8E"/>
    <line x1="81" y1="30" x2="92" y2="41" stroke="#1D5F8E" stroke-width="3"/>
    <line x1="103" y1="30" x2="92" y2="41" stroke="#1D5F8E" stroke-width="3"/>
    <line x1="81" y1="52" x2="92" y2="41" stroke="#1D5F8E" stroke-width="3"/>
    <line x1="103" y1="52" x2="92" y2="41" stroke="#1D5F8E" stroke-width="3"/>

    <!-- Il Collante (Gold Connecting Bridge) -->
    <path d="M28 41 C38 27, 82 27, 92 41" stroke="#E9A100" stroke-width="8" stroke-linecap="round"/>
    <circle cx="28" cy="41" r="6" fill="#E9A100" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="92" cy="41" r="6" fill="#E9A100" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="145" y="52" font-family="'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="40" letter-spacing="-1.2" fill="#13202C">Il collante</text>
  <text x="148" y="70" font-family="'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="11.5" letter-spacing="1.5" fill="#526476" text-transform="uppercase">Hardware &amp; AI Integration</text>
</svg>
