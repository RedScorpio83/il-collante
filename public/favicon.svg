<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root {
      --bg: #13202C;
      --left: #E8EEF3;
      --right: #6DB2E8;
      --bridge: #F5B324;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #E9EEF2;
        --left: #13202C;
        --right: #1D5F8E;
        --bridge: #E9A100;
      }
    }
  </style>
  <rect width="32" height="32" rx="7" fill="var(--bg)"/>
  <!-- Hardware Node (Left) -->
  <path d="M10 7 L17 11 L17 21 L10 25 L3 21 L3 11 Z" stroke="var(--left)" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
  <circle cx="10" cy="16" r="2.8" stroke="var(--left)" stroke-width="1.4" fill="none"/>

  <!-- AI / Network Node (Right) -->
  <path d="M22 7 L29 11 L29 21 L22 25 L15 21 L15 11 Z" stroke="var(--right)" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
  <circle cx="22" cy="16" r="1.5" fill="var(--right)"/>
  <circle cx="18.5" cy="12.5" r="1" fill="var(--right)"/>
  <circle cx="25.5" cy="12.5" r="1" fill="var(--right)"/>
  <circle cx="18.5" cy="19.5" r="1" fill="var(--right)"/>
  <circle cx="25.5" cy="19.5" r="1" fill="var(--right)"/>
  <line x1="18.5" y1="12.5" x2="22" y2="16" stroke="var(--right)" stroke-width="1"/>
  <line x1="25.5" y1="12.5" x2="22" y2="16" stroke="var(--right)" stroke-width="1"/>
  <line x1="18.5" y1="19.5" x2="22" y2="16" stroke="var(--right)" stroke-width="1"/>
  <line x1="25.5" y1="19.5" x2="22" y2="16" stroke="var(--right)" stroke-width="1"/>

  <!-- Il Collante (Gold Connecting Bridge) -->
  <path d="M10 16 C13 11.5, 19 11.5, 22 16" stroke="var(--bridge)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <circle cx="10" cy="16" r="1.6" fill="var(--bridge)"/>
  <circle cx="22" cy="16" r="1.6" fill="var(--bridge)"/>
</svg>
